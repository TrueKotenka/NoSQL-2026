services:
  cassandra1:
    image: cassandra:4.1.12
    hostname: cassandra1
    environment: &cassandra_env
      CASSANDRA_CLUSTER_NAME: shop_events_cluster
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra1
      CASSANDRA_NUM_TOKENS: 16
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - cassandra1_data:/var/lib/cassandra
      - ./cql:/workspace/cql:ro
    healthcheck: &cassandra_health
      test: ["CMD-SHELL", "cqlsh -e 'SELECT release_version FROM system.local;' >/dev/null 2>&1"]
      start_period: 90s
      interval: 15s
      timeout: 12s
      retries: 30
    stop_grace_period: 30s

  cassandra2:
    image: cassandra:4.1.12
    hostname: cassandra2
    environment: *cassandra_env
    depends_on:
      cassandra1:
        condition: service_healthy
    volumes:
      - cassandra2_data:/var/lib/cassandra
    healthcheck: *cassandra_health
    stop_grace_period: 30s

  cassandra3:
    image: cassandra:4.1.12
    hostname: cassandra3
    environment: *cassandra_env
    depends_on:
      cassandra2:
        condition: service_healthy
    volumes:
      - cassandra3_data:/var/lib/cassandra
    healthcheck: *cassandra_health
    stop_grace_period: 30s

volumes:
  cassandra1_data:
  cassandra2_data:
  cassandra3_data:
